<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アポタスク">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>アポ管理タスク</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1b2433;--sub:#6b7686;--line:#e5e9f0;--pri:#2563eb;--pri-soft:#e8efff;--ok:#16a34a;--warn:#d97706;--ng:#dc2626;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#18202b;--text:#e8edf5;--sub:#93a0b3;--line:#2a3442;--pri:#5b8cff;--pri-soft:#1e2c4d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
#sync{font-size:12px;color:var(--sub)}
main{padding:0 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
nav .dot{position:absolute;top:4px;right:calc(50% - 20px);background:var(--ng);color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
h2{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.card.click{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t{font-weight:700;word-break:break-word}
.s{color:var(--sub);font-size:13px;word-break:break-word}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:700;white-space:nowrap}
.badge.ok{background:#dcfce7;color:var(--ok)}.badge.warn{background:#fef3c7;color:var(--warn)}.badge.ng{background:#fee2e2;color:var(--ng)}.badge.gray{background:var(--line);color:var(--sub)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;background:var(--pri);color:#fff}
.btn.sec{background:var(--pri-soft);color:var(--pri)}.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line)}.btn.ng{background:#fee2e2;color:var(--ng)}.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:7}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;color:var(--sub);font-weight:700;font-size:13px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px;font-weight:700}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:#fff;font-size:13px;line-height:18px;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:28px 0}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:var(--r);padding:10px 14px;margin:8px 0;font-size:14px}
.sum{background:var(--pri-soft);border-radius:12px;padding:10px 12px;white-space:pre-wrap;margin-top:8px}
.thumb{width:56px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;overflow:auto}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--pri);width:0}
</style>
</head>
<body>
<header><h1 id="title">ホーム</h1><span id="sync"></span></header>
<main id="main"></main>
<button class="fab" id="fab" data-a="fab">＋</button>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
/* ========== 基本ユーティリティ ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const dayStart = s => { const d = new Date(s.length === 10 ? s + 'T00:00:00' : s); d.setHours(0,0,0,0); return d; };
const daysBetween = (a, b) => Math.round((dayStart(b) - dayStart(a)) / 86400000);
const daysSince = s => s ? daysBetween(s, today()) : null;
const WD = ['日','月','火','水','木','金','土'];
const fmtD = s => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T00:00:00' : s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const fmtDT = s => s ? `${fmtD(s)} ${s.slice(11,16)}` : '';
const rel = s => { const n = daysBetween(today(), s); return n === 0 ? '今日' : n === 1 ? '明日' : n === -1 ? '昨日' : n > 0 ? `あと${n}日` : `${-n}日超過`; };

/* ========== データ ========== */
const KEY = 'apotask-v1';
const defaults = () => ({ appts: [], tasks: [], contacts: [], team: [],
  settings: { name: '', project: '', sbUrl: '', sbKey: '', aiKey: '', alarmHour: 18 }, alarmed: {} });
let S = (() => { try { const d = JSON.parse(localStorage.getItem(KEY)); return d ? Object.assign(defaults(), d, { settings: Object.assign(defaults().settings, d.settings) }) : defaults(); } catch { return defaults(); } })();
let saveTimer;
function save(push = true) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存容量がいっぱいです'); }
  if (push) { clearTimeout(saveTimer); saveTimer = setTimeout(syncNow, 1500); }
}
const byId = (arr, id) => arr.find(x => x.id === id);

/* ========== 画面状態 ========== */
let tab = 'home', apptFilter = 'seeking', ui = {};
const TABS = [['home','ホーム','🏠'],['appts','アポ','📅'],['tasks','タスク','✅'],['contacts','連絡帳','📇'],['team','チーム','👥']];

function badgeCount() {
  const t = today();
  return S.tasks.filter(x => !x.done && x.due && x.due <= t).length +
         S.appts.filter(a => a.status === 'seeking' && a.deadline && a.deadline <= t).length;
}
function render() {
  $('#title').textContent = TABS.find(t => t[0] === tab)[1];
  $('#nav').innerHTML = TABS.map(([k, n, i]) => `<button class="${k===tab?'on':''}" data-a="tab" data-v="${k}"><span class="ic">${i}</span>${n}${k==='home'&&badgeCount()?`<span class="dot">${badgeCount()}</span>`:''}</button>`).join('');
  $('#fab').style.display = ['appts','tasks','contacts'].includes(tab) ? 'block' : 'none';
  $('#main').innerHTML = { home: vHome, appts: vAppts, tasks: vTasks, contacts: vContacts, team: vTeam }[tab]();
}

/* ========== ホーム ========== */
function followUps() {
  return S.contacts.map(c => ({ c, d: daysSince(lastTouch(c)) })).filter(x => x.d !== null && x.d >= 14 && !S.appts.some(a => a.contactId === x.c.id && a.status !== 'done'))
    .sort((a, b) => b.d - a.d);
}
function lastTouch(c) {
  const ds = S.appts.filter(a => a.contactId === c.id && (a.status === 'done' || a.status === 'booked')).map(a => (a.datetime || a.bookedAt || '').slice(0, 10)).filter(Boolean).filter(d => d <= today());
  return ds.sort().pop() || c.metAt || c.createdAt;
}
function vHome() {
  const t = today(), tm = ymd(new Date(Date.now() + 86400000));
  const booked = S.appts.filter(a => a.status === 'booked' && a.datetime);
  const todayA = booked.filter(a => a.datetime.slice(0, 10) === t).sort((a, b) => a.datetime.localeCompare(b.datetime));
  const tomorrowA = booked.filter(a => a.datetime.slice(0, 10) === tm).sort((a, b) => a.datetime.localeCompare(b.datetime));
  const needLog = booked.filter(a => a.datetime.slice(0, 10) < t);
  const seek = S.appts.filter(a => a.status === 'seeking').sort((a, b) => (a.deadline || '9').localeCompare(b.deadline || '9')).slice(0, 5);
  const tasks = S.tasks.filter(x => !x.done && (!x.due || x.due <= tm)).sort((a, b) => (a.due || '9').localeCompare(b.due || '9'));
  const fu = followUps().slice(0, 5);
  let h = '';
  if ('Notification' in window && Notification.permission === 'default') h += `<div class="banner">前日アラームを通知で受け取るには、通知を許可してください。<div style="margin-top:8px"><button class="btn sm" data-a="askNotif">通知をオンにする</button></div></div>`;
  if (tomorrowA.length) h += `<div class="banner">⏰ 明日のアポ: ${tomorrowA.map(a => `${esc(a.datetime.slice(11,16))} ${esc(a.person)}`).join(' / ')}</div>`;
  h += `<h2>今日のアポ</h2>` + (todayA.length ? todayA.map(apptCard).join('') : '<div class="card s">今日のアポはありません</div>');
  if (needLog.length) h += `<h2>記録がまだのアポ</h2>` + needLog.map(apptCard).join('');
  if (seek.length) h += `<h2>アポ取り中(期限が近い順)</h2>` + seek.map(apptCard).join('');
  h += `<h2>今日・明日までのタスク</h2>` + (tasks.length ? tasks.map(taskRow).join('') : '<div class="card s">期限が近いタスクはありません</div>');
  if (fu.length) h += `<h2>そろそろ連絡しませんか?</h2>` + fu.map(({ c, d }) => `<div class="card click" data-a="openContact" data-v="${c.id}"><div class="row"><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.company)}</div></div><span class="badge ${d>=30?'ng':'warn'}">最終接触から${d}日</span></div></div>`).join('');
  return h;
}

/* ========== アポ ========== */
const ST = { seeking: ['アポ取り中', 'warn'], booked: ['アポ確定', ''], done: ['完了', 'ok'] };
function apptCard(a) {
  const [lab, cls] = ST[a.status];
  let sub = '';
  if (a.status === 'seeking') sub = a.deadline ? `期限 ${fmtD(a.deadline)}(${rel(a.deadline)})` : '期限なし';
  else sub = fmtDT(a.datetime) + (a.place ? ' ・ ' + esc(a.place) : '');
  const over = a.status === 'seeking' && a.deadline && a.deadline < today();
  const needLog = a.status === 'booked' && a.datetime && a.datetime.slice(0, 10) < today();
  return `<div class="card click" data-a="openAppt" data-v="${a.id}"><div class="row"><div class="grow"><div class="t">${esc(a.person)}${a.company ? `<span class="s"> / ${esc(a.company)}</span>` : ''}</div><div class="s">${sub}</div>${a.purpose ? `<div class="s">目的: ${esc(a.purpose)}</div>` : ''}</div><span class="badge ${over || needLog ? 'ng' : cls}">${over ? '期限超過' : needLog ? '記録待ち' : lab}</span></div></div>`;
}
function vAppts() {
  const list = S.appts.filter(a => a.status === apptFilter).sort((a, b) => apptFilter === 'seeking' ? (a.deadline || '9').localeCompare(b.deadline || '9') : apptFilter === 'booked' ? (a.datetime || '').localeCompare(b.datetime || '') : (b.datetime || '').localeCompare(a.datetime || ''));
  const cnt = k => S.appts.filter(a => a.status === k).length;
  return `<div class="seg">${Object.entries(ST).map(([k, v]) => `<button class="${apptFilter===k?'on':''}" data-a="apptFilter" data-v="${k}">${v[0]} ${cnt(k)}</button>`).join('')}</div>` +
    (list.length ? list.map(apptCard).join('') : '<div class="empty">まだありません<br>右下の＋から「誰に・いつまでに」を登録しましょう</div>');
}
function contactOptions(sel) { return `<option value="">(連絡帳から選ぶ)</option>` + S.contacts.map(c => `<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}${c.company ? ' / ' + esc(c.company) : ''}</option>`).join(''); }
function apptForm(id) {
  const a = id ? byId(S.appts, id) : { status: 'seeking', deadline: ymd(new Date(Date.now() + 7 * 86400000)) };
  openModal(`<h3>${id ? 'アポを編集' : 'アポを登録'}</h3>
  <label>誰に</label><select id="f-contact" data-change="pickContact">${contactOptions(a.contactId)}</select>
  <input id="f-person" placeholder="氏名(新しい相手はここに入力)" value="${esc(a.person)}" style="margin-top:6px">
  <label>会社</label><input id="f-company" value="${esc(a.company)}">
  <label>目的・内容</label><input id="f-purpose" value="${esc(a.purpose)}" placeholder="例: 物件の紹介打ち合わせ">
  <label>状態</label><select id="f-status" data-change="statusChg"><option value="seeking" ${a.status==='seeking'?'selected':''}>アポ取り中</option><option value="booked" ${a.status==='booked'?'selected':''}>アポ確定</option><option value="done" ${a.status==='done'?'selected':''}>完了</option></select>
  <div id="f-seek" style="display:${a.status==='seeking'?'block':'none'}"><label>いつまでにアポを取るか(期限)</label><input type="date" id="f-deadline" value="${esc(a.deadline)}"></div>
  <div id="f-book" style="display:${a.status==='seeking'?'none':'block'}"><label>アポの日時</label><input type="datetime-local" id="f-datetime" value="${esc(a.datetime)}"><label>場所</label><input id="f-place" value="${esc(a.place)}"></div>
  <div class="bar"><button class="btn" data-a="saveAppt" data-v="${id || ''}">保存</button><button class="btn ghost" data-a="close">キャンセル</button>${id ? `<button class="btn ng" data-a="delAppt" data-v="${id}">削除</button>` : ''}</div>`);
}
function saveApptFromForm(id) {
  const g = i => ($('#' + i)?.value || '').trim();
  const person = g('f-person');
  if (!person) return toast('氏名を入力してください');
  const status = g('f-status');
  if (status !== 'seeking' && !g('f-datetime')) return toast('アポの日時を入力してください');
  let a = id ? byId(S.appts, id) : { id: uid(), createdAt: today(), notes: '', summary: '', owner: S.settings.name, shared: true };
  const prev = a.status;
  Object.assign(a, { person, company: g('f-company'), purpose: g('f-purpose'), status, deadline: g('f-deadline'), datetime: g('f-datetime'), place: g('f-place'), contactId: g('f-contact') || a.contactId || '' });
  if (status !== 'seeking' && !a.bookedAt) a.bookedAt = today();
  if (status === 'seeking') { a.datetime = ''; }
  a.contactId = ensureContact(a);
  a.updatedAt = Date.now();
  if (!id) S.appts.push(a);
  delete S.alarmed[a.id];
  save(); closeModal(); render();
  if (prev !== 'booked' && status === 'booked') calPrompt(a.id);
}
function ensureContact(a) {
  let c = a.contactId && byId(S.contacts, a.contactId);
  if (!c) c = S.contacts.find(x => x.name === a.person && (!a.company || x.company === a.company));
  if (!c) { c = { id: uid(), name: a.person, company: a.company, createdAt: today(), metAt: a.bookedAt || '' }; S.contacts.push(c); }
  return c.id;
}
function calPrompt(id) {
  const a = byId(S.appts, id);
  openModal(`<h3>アポが確定しました 🎉</h3><p class="s">${esc(a.person)} ・ ${fmtDT(a.datetime)}</p><p>カレンダーに登録しますか?(前日の通知もアプリが出します)</p>
  <div class="bar"><button class="btn" data-a="gcal" data-v="${id}">Googleカレンダーに追加</button><button class="btn sec" data-a="ics" data-v="${id}">.icsで保存</button><button class="btn ghost" data-a="close">あとで</button></div>`);
}
function apptDetail(id) {
  const a = byId(S.appts, id);
  if (!a) return;
  const [lab] = ST[a.status];
  const nt = a.nextTasks || [];
  openModal(`<h3>${esc(a.person)} <span class="badge">${lab}</span></h3>
  <div class="s">${esc(a.company)}${a.purpose ? ' ・ 目的: ' + esc(a.purpose) : ''}</div>
  <div class="s">${a.status === 'seeking' ? '期限 ' + fmtD(a.deadline) : fmtDT(a.datetime) + (a.place ? ' ・ ' + esc(a.place) : '')}</div>
  <div class="bar">
   ${a.status === 'seeking' ? `<button class="btn" data-a="markBooked" data-v="${id}">アポが取れた</button>` : `<button class="btn sec" data-a="gcal" data-v="${id}">📅 Googleカレンダー</button><button class="btn sec" data-a="ics" data-v="${id}">.ics</button>`}
   <button class="btn ghost" data-a="editAppt" data-v="${id}">編集</button></div>
  ${a.status !== 'seeking' ? `<label>当日のメモ(話した内容・決まったこと)</label>
  <textarea id="f-notes" placeholder="箇条書きでも文章でもOK。書いたあと「要約してタスクを出す」を押します">${esc(a.notes)}</textarea>
  <div class="bar"><button class="btn" id="btn-sum" data-a="summarize" data-v="${id}">✨ 要約してタスクを出す</button></div>
  <div class="hint">${S.settings.aiKey ? 'AI(Claude)で要約します' : '簡易要約モード(設定でAPIキーを入れるとAI要約になります)'}</div>` : ''}
  ${a.summary ? `<h2>要約</h2><div class="sum">${esc(a.summary)}</div>` : ''}
  ${nt.length ? `<h2>次のタスク候補</h2>${nt.map((t, i) => `<div class="card"><div class="row"><div class="grow">${esc(t.title)}<div class="s">期限 ${esc(fmtD(t.due))}</div></div>${t.added ? '<span class="badge ok">追加済</span>' : `<button class="btn sm" data-a="addNext" data-v="${id}:${i}">タスクに追加</button>`}</div></div>`).join('')}${nt.some(t => !t.added) ? `<button class="btn sec" data-a="addAllNext" data-v="${id}">すべて追加</button>` : ''}` : ''}
  <div class="bar"><button class="btn ghost" data-a="close">閉じる</button>${a.status === 'booked' ? `<button class="btn sec" data-a="markDone" data-v="${id}">完了にする</button>` : ''}</div>`);
}

/* ========== 要約 ========== */
async function summarize(id) {
  const a = byId(S.appts, id);
  a.notes = $('#f-notes').value.trim();
  if (!a.notes) return toast('メモを入力してください');
  const btn = $('#btn-sum'); btn.disabled = true; btn.textContent = '要約中…';
  let res;
  try { res = S.settings.aiKey ? await aiSummary(a) : localSummary(a.notes); }
  catch (e) { toast('AI要約に失敗。簡易要約に切り替えました'); res = localSummary(a.notes); }
  a.summary = res.summary; a.nextTasks = res.tasks.map(t => ({ title: t.title, due: t.due || ymd(new Date(Date.now() + 3 * 86400000)) }));
  a.updatedAt = Date.now();
  save(); apptDetail(id);
}
async function aiSummary(a) {
  const prompt = `以下は「${a.person}(${a.company || '会社不明'})」との面談メモです。目的: ${a.purpose || '不明'}。今日は${today()}です。\nJSONのみで返してください: {"summary":"3行以内の簡潔な要約(改行は\\n)","tasks":[{"title":"次にやること","due":"YYYY-MM-DD"}]}\ntasksは最大6件、期限はメモの内容から妥当な日付を推定。\n\n--- メモ ---\n${a.notes}`;
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': S.settings.aiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-haiku-4-5', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] }) });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  const txt = j.content.map(c => c.text || '').join('');

function closeModal() { $('#modal').classList.remove('open'); }
let tt;
function toast(m, ms = 2500) { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#111c;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;max-width:90%;font-size:14px'; document.body.appendChild(t); } t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', ms); }

/* ========== イベント ========== */
const A = {
  tab: v => { tab = v; render(); window.scrollTo(0, 0); },
  fab: () => tab === 'appts' ? apptForm() : tab === 'tasks' ? taskForm() : contactForm(),
  close: closeModal,
  apptFilter: v => { apptFilter = v; render(); },
  openAppt: v => apptDetail(v), editAppt: v => apptForm(v), saveAppt: v => saveApptFromForm(v),
  delAppt: v => { if (!confirm('このアポを削除しますか?')) return; (S.deletedIds ||= []).push(v); S.appts = S.appts.filter(a => a.id !== v); save(); closeModal(); render(); },
  markBooked: v => { const a = byId(S.appts, v); a.status = 'booked'; a.bookedAt = today(); save(false); apptForm(v); toast('日時と場所を入力してください'); },
  markDone: v => { const a = byId(S.appts, v); a.notes = $('#f-notes')?.value ?? a.notes; a.status = 'done'; save(); closeModal(); render(); toast('完了にしました'); },
  gcal: v => { window.open(gcalUrl(byId(S.appts, v)), '_blank'); },
  ics: v => downloadIcs(byId(S.appts, v)),
  summarize: v => summarize(v),
  addNext: v => { const [id, i] = v.split(':'); addNext(id, +i); save(); apptDetail(id); },
  addAllNext: v => { byId(S.appts, v).nextTasks.forEach((t, i) => { if (!t.added) addNext(v, i); }); save(); apptDetail(v); toast('タスクに追加しました'); },
  toggleTask: v => { const t = byId(S.tasks, v); t.done = !t.done; save(); render(); },
  editTask: v => taskForm(v),
  saveTask: v => { const title = $('#f-title').value.trim(); if (!title) return toast('内容を入力してください'); let t = v ? byId(S.tasks, v) : { id: uid(), owner: S.settings.name, shared: true }; t.title = title; t.due = $('#f-due').value; if (!v) S.tasks.push(t); save(); closeModal(); render(); },
  delTask: v => { (S.deletedIds ||= []).push(v); S.tasks = S.tasks.filter(t => t.id !== v); save(); closeModal(); render(); },
  openContact: v => contactDetail(v), editContact: v => contactForm(v), scanCard,
  newApptFor: v => { closeModal(); apptForm(); const c = byId(S.contacts, v); $('#f-contact').value = v; $('#f-person').value = c.name; $('#f-company').value = c.company || ''; },
  saveContact: v => {
    const g = k => $('#c-' + k).value.trim(); if (!g('name')) return toast('氏名を入力してください');
    let c = v ? byId(S.contacts, v) : { id: uid(), createdAt: today(), metAt: today() };
    Object.assign(c, { name: g('name'), company: g('company'), title: g('title'), phone: g('phone'), email: g('email'), address: g('address'), memo: g('memo') });
    if (ui.cardImg) c.img = ui.cardImg; if (!v) S.contacts.push(c); save(false); closeModal(); render(); toast('連絡帳に保存しました');
  },
  delContact: v => { if (!confirm('この連絡先を削除しますか?')) return; S.contacts = S.contacts.filter(c => c.id !== v); save(false); closeModal(); render(); },
  saveSettings: () => { const s = S.settings; for (const k of ['name', 'project', 'sbUrl', 'sbKey', 'aiKey']) s[k] = $('#s-' + k).value.trim(); s.alarmHour = +$('#s-alarmHour').value; S.alarmed = {}; save(false); toast('設定を保存しました'); syncNow(); setTimeout(render, 300); },
  askNotif: async () => { if (!('Notification' in window)) return toast('この端末は通知に未対応です(iPhoneはホーム画面に追加すると使えます)'); const r = await Notification.requestPermission(); toast(r === 'granted' ? '通知をオンにしました' : '通知が許可されませんでした'); render(); },
  syncNow: () => syncNow(),
  exportData: () => { const url = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); const l = document.createElement('a'); l.href = url; l.download = `apotask-backup-${today()}.json`; l.click(); }
};
function addNext(id, i) { const a = byId(S.appts, id), n = a.nextTasks[i]; if (n.added) return; S.tasks.push({ id: uid(), title: n.title, due: n.due, apptId: id, owner: S.settings.name, shared: true }); n.added = true; }
const ACT = { pickContact: el => { const c = byId(S.contacts, el.value); if (c) { $('#f-person').value = c.name; $('#f-company').value = c.company || ''; } },
  statusChg: el => { $('#f-seek').style.display = el.value === 'seeking' ? 'block' : 'none'; $('#f-book').style.display = el.value === 'seeking' ? 'none' : 'block'; } };
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-a]'); if (!el) return;
  A[el.dataset.a]?.(el.dataset.v);
});
document.addEventListener('change', e => { const f = e.target.dataset.change; if (f) ACT[f](e.target); });
document.addEventListener('input', e => { if (e.target.dataset.input === 'search') { ui.q = e.target.value; const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); } });

/* ========== 起動 ========== */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); checkAlarms(); syncNow();
setInterval(checkAlarms, 30000);
setInterval(syncNow, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkAlarms(); syncNow(); render(); } });
</script>
</body>
</html>
